services:
  ai-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV_FILE: .env.jp
    container_name: ai-site-jp
    restart: unless-stopped
    ports:
      - "4001:3000"
    # Next 服务端 rewrite(/auth-api) 转发 auth-server 用 host.docker.internal:8003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.jp
